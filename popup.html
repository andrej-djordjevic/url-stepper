<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 220px;
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #eee;
      }
      .buttons {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 10px 0;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background: #3a3a3a;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #4a4a4a; }
      button:disabled { opacity: 0.4; cursor: default; }
      #url {
        margin-top: 10px;
        font-size: 12px;
        color: #aaa;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="buttons">
      <button id="down" title="Decrease (Alt+Shift+Down)">▼ −1</button>
      <button id="up" title="Increase (Alt+Shift+Up)">▲ +1</button>
    </div>
    <div id="url"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
